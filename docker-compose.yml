services:
  app:
    build: .
    container_name: deal-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
    env_file:
      - .env
    command: python -m app.bot

  postgres:
    image: postgres:16
    container_name: deal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: deal_platform
      POSTGRES_USER: dealuser
      POSTGRES_PASSWORD: dealpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: deal-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data: