version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: deal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: deal_platform
      POSTGRES_USER: dealuser
      POSTGRES_PASSWORD: dealpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: deal-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data:
